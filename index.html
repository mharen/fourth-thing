  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourth Thing</title>
  <meta name="description" content="Spin to pick this week's fourth standup topic—the fun one after did, doing, and blocked.">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f5ee" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b0f0c'/><text x='8.5' y='12.5' font-family='monospace' font-size='11' font-weight='bold' text-anchor='middle' fill='%234ade80'>4</text></svg>">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0b0f0c;
      --ink: #d7e0d9;
      --dim: #8a988e;
      --accent: #4ade80;
      --glow: 0 0 28px rgba(74, 222, 128, 0.28);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f5ee;
        --ink: #1f2421;
        --dim: #5a635c;
        --accent: #0b6b3a;
        --glow: none;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.5;
    }

    main {
      min-height: 100svh;
      max-width: 72rem;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 300;
      color: var(--accent);
      margin: 0;

      &::before {
        content: '# ';
      }

      span {
        margin: 0 .25rem;
        color: var(--dim);
      }
    }

    .prompt {
      margin: 1rem 0 0;
      color: var(--dim);

      &::before {
        content: '$ ';
        color: var(--accent);
      }
    }

    .log {
      height: 4.5rem;
      overflow: hidden;
      color: var(--dim);
    }

    .log div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      &::before {
        content: '> '
      }
    }

    .log div:nth-child(1) {
      opacity: 0.25;
    }

    .log div:nth-child(2) {
      opacity: 0.45;
    }

    .log div:nth-child(3) {
      opacity: 0.7;
    }

    .result {
      margin: 0;
      min-height: 2.4em;
      font-size: clamp(1.75rem, 5.5vw, 5rem);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: break-word;
      text-shadow: var(--glow);
    }

    .result.idle {
      color: var(--dim);
      font-weight: 400;
      text-shadow: none;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      margin-left: 0.12em;
      vertical-align: text-bottom;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    footer {
      color: var(--dim);
      font-size: 0.85rem;

      &::before {
        content: '# ';
      }
    }

    /* keyboard-key buttons in the footer — look like <kbd>, act like buttons */
    .key {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--dim);
      border-radius: 3px;
      padding: 0 0.35em;
      cursor: pointer;
    }

    .key:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .key:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>

    <div class="log" aria-hidden="true">

    <footer>
      press <button class="key" type="button">enter ⏎</button>
      or <button class="key" type="button">space</button> to run
    </footer>
    <noscript>
      <p>JavaScript is required. Sorry—the randomness lives there.</p>
    </noscript>

    const KEY = "fourth-thing:recent";
    const HISTORY_MAX = 50;

    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const live = document.getElementById("live");
    const logLines = document.querySelectorAll(".log div");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let spinning = false;
    let spunThisSession = false;

    const randomFrom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function loadHistory() {
      try {
        const v = JSON.parse(localStorage.getItem(KEY));
        return Array.isArray(v)
          ? v.filter((t) => typeof t === "string").slice(-HISTORY_MAX)
          : [];
      } catch {
        return [];
      }
    }

    function saveHistory(h) {
      try {
        localStorage.setItem(KEY, JSON.stringify(h.slice(-HISTORY_MAX)));
      } catch { }
    }

    function eligiblePool() {
      const recent = new Set(loadHistory());
      const pool = TOPICS.filter((t) => !recent.has(t));
      return pool.length ? pool : TOPICS;
    }

    function recordPick(topic) {
      const history = loadHistory();
      if (spunThisSession) history.pop();
      history.push(topic);
      saveHistory(history);
      spunThisSession = true;
    }

    function pushLog(text) {
      for (let i = 0; i < logLines.length - 1; i++)
        logLines[i].textContent = logLines[i + 1].textContent;

      logLines[logLines.length - 1].textContent = text;
    }

    function reveal(winner) {
      result.classList.remove("idle");
      recordPick(winner);
      const done = () => {
        live.textContent = winner;
        spinning = false;
      };
      if (reduceMotion.matches) {
        resultText.textContent = winner;
        done();
        return;
      }
      resultText.textContent = "";
      let i = 0;
      (function type() {
        resultText.textContent = winner.slice(0, ++i);
        if (i < winner.length) setTimeout(type, 16);
        else done();
      })();
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      const winner = randomFrom(eligiblePool());
      if (reduceMotion.matches) {
        reveal(winner);
        return;
      }
      resultText.textContent = "";
      live.textContent = "";
      result.classList.remove("idle");
      let delay = 45;
      let last = "";
      (function frame() {
        let t;
        do
          t = randomFrom(TOPICS);
        while (t === last);

        last = t;
        pushLog(t);

        if (delay >= 260) {
          pushLog("✓ " + winner);
          reveal(winner);
          return;
        }

        delay *= 1.14;
        setTimeout(frame, delay);
      })();
    }

    for (const button of document.getElementsByTagName('button'))
      button.addEventListener("click", spin);

    addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target === document.body) {
        e.preventDefault();
        spin();
      }
    });

    spin();
